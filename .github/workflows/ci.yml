name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenticubed
          POSTGRES_PASSWORD: agenticubed
          POSTGRES_DB: agenticubed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenticubed"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Live Postgres/Redis so we verify migrations + readiness for real (issue 0001).
      DATABASE_URL: postgresql+asyncpg://agenticubed:agenticubed@localhost:5432/agenticubed
      DATABASE_URL_SYNC: postgresql+psycopg://agenticubed:agenticubed@localhost:5432/agenticubed
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pipx install uv
      - name: Create venv + install
        run: |
          uv venv .venv
          uv pip install --python .venv -e ".[dev,analysis]"
      - name: Lint (ruff + black)
        run: |
          .venv/bin/ruff check .
          .venv/bin/black --check .
      - name: Apply migrations against real Postgres
        run: .venv/bin/alembic upgrade head
      - name: Tests
        run: .venv/bin/python -m pytest -q --ignore=tests/integration/test_demo.py
      - name: Governed objective-to-close proof
        run: .venv/bin/python -m pytest tests/integration/test_demo.py -q
      - name: Celery spine smoke (real broker + worker process)
        env:
          CELERY_BROKER_SMOKE: "1"
          WORKFLOW_ENGINE_BACKEND: celery
        run: .venv/bin/python -m pytest tests/integration/test_celery_broker_smoke.py -q
      - name: Readiness smoke test (db + redis)
        run: |
          .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          BODY=$(curl -sf http://localhost:8000/readyz)
          echo "$BODY"
          echo "$BODY" | python -c "import json,sys; d=json.load(sys.stdin); c=d.get('checks',{}); assert c.get('database')=='ok',f'database not ok: {d}'; assert c.get('redis')=='ok',f'redis not ok: {d}'"
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (hermetic API for full-stack e2e)
        # [dev] carries aiosqlite — the e2e backend runs on SQLite (no Postgres
        # service in this job), same hermetic surface as the integration suite.
        run: pip install "../backend[dev]"
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, full stack)
        run: npx playwright test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize CI-only .env for compose validation
        run: cp .env.example .env
      - name: Validate development compose
        run: docker compose config -q
      - name: Validate production compose profiles
        # SITE_ADDRESS is required (no default) so config validation proves
        # the interpolation contract, not just YAML syntax.
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config -q
          docker compose -f docker-compose.prod.yml --env-file .env.prod --profile local-db config -q
          docker compose -f docker-compose.prod.yml --env-file .env.prod --profile tools config -q
      - name: Validate production proxy
        run: >-
          docker run --rm
          -e SITE_ADDRESS=a3.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile
      - name: Build production images
        run: >-
          docker compose --env-file .env.prod
          -f docker-compose.prod.yml build api frontend
      - name: Verify production operations scripts
        run: |
          sh -n scripts/prod_smoke.sh
          bash -n scripts/production_backup.sh
          bash -n scripts/production_restore.sh
          python scripts/test_prod_smoke.py

  dependency-audit:
    # Supply-chain gate (next-steps Step 2, gap G3): fail the build on known
    # vulnerabilities instead of waiting for a human to read an advisory.
    # Waivers (with mandatory expiry dates) live in scripts/dependency-audit-waivers.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend environment + pip-audit
        # Audit the resolved environment, not just the manifest, so transitive
        # pins are covered. pip/setuptools are upgraded first — they are part
        # of the audited environment too.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "./backend[dev,analysis]" pip-audit
      - name: Backend audit (pip-audit, fails on any non-waived vulnerability)
        run: python scripts/dependency_audit.py backend
      - name: Frontend audit (npm audit, fails on non-waived critical advisories)
        # npm audit resolves from package-lock.json via the registry bulk
        # advisory endpoint — no npm ci needed.
        run: python scripts/dependency_audit.py frontend
