name: Live provider smoke

# Next-steps Step 3 (gap G4): standing evidence that the real inference path
# works. One real task through the `gemini` adapter — dispatch → execution →
# evaluation — asserting shape, not content. Google AI Studio's free tier
# means the nightly run costs nothing. Opt-in and secret-gated so hermetic CI
# stays mock-only (assumption A15): when the GEMINI_API_KEY secret is absent
# the job SKIPS its steps and passes.
#
# The gate and the test must agree on the credential. tests/live/
# test_live_provider_smoke.py skips unless GEMINI_API_KEY is present, so
# gating this job on any other secret produces a green run that silently
# skipped — worse than a red one, because it looks like evidence.
#
# The Celery-spine variant of this proof is live-provider-proof.yml
# (manual dispatch, Postgres + Redis); this one covers the inline API path.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # nightly, 06:17 UTC

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Detect credential
        id: cred
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY secret not configured — skipping live smoke (job passes)."
          fi
      - uses: actions/setup-python@v5
        if: steps.cred.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install backend
        if: steps.cred.outputs.present == 'true'
        # [dev] carries aiosqlite for the hermetic test database.
        run: pip install ".[dev]"
      - name: Live provider smoke (one real task, shape asserted)
        if: steps.cred.outputs.present == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIVE_PROVIDER_SMOKE: "1"
        # -rs prints skip reasons. A skipped live test still exits 0, so
        # without this a mis-set credential reads as a passing proof.
        run: python -m pytest tests/live/test_live_provider_smoke.py -q -rs
