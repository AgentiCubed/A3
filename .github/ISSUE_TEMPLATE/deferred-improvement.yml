name: Deferred improvement
description: Open a deferred product or platform improvement with explicit acceptance criteria.
title: "[Improvement]: "
labels:
  - type:enhancement
  - status:needs-triage
body:
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Live runs
        - Quality
        - Transparency
        - Intake
        - Platform
        - Governance
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Monorepo areas affected
      options:
        - label: backend
        - label: frontend
        - label: workers
        - label: deploy/infra
        - label: docs/governance
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph description of the improvement.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is incomplete or painful today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true when this work is complete?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use one checkbox line per acceptance criterion.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Cross-issue, schema, or rollout dependencies.
  - type: textarea
    id: security
    attributes:
      label: Security and risk notes
      description: Auth, secrets, audit, migration, or safety considerations.
