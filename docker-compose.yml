services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenticubed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenticubed}
      POSTGRES_DB: ${POSTGRES_DB:-agenticubed}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenticubed}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_BACKEND: redis
      WORKFLOW_ENGINE_BACKEND: celery
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - artifacts:/var/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      # The worker publishes audit-driven live events and, after completing a
      # task, submits newly-unblocked successors back through the engine.
      EVENT_BUS_BACKEND: redis
      WORKFLOW_ENGINE_BACKEND: celery
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    volumes:
      - ./backend:/app
      - artifacts:/var/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Browser (on the host) reaches the API via the published port…
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # …while the web container's server-side calls reach it over the compose network.
      INTERNAL_API_BASE_URL: http://api:8000
    command: npm run dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  artifacts:
