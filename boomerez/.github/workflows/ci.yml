name: Static Site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify scaffold-critical files exist
        run: |
          required_files=(
            README.md
            LICENSE
            .gitignore
            packages/tokens/tokens.css
            packages/earl-lint/earl_lint.py
            packages/earl-lint/rubric.json
            tools/build.py
            tools/run_tests.py
            docs/DESIGN-STANDARD.md
            docs/DEVLOG.md
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          echo "Scaffold-critical files found."

      - name: Run test suite
        run: python3 tools/run_tests.py

      - name: Validate HTML (W3C Nu, errors-only)
        run: |
          if find apps -type f -name '*.html' | grep -q .; then
            docker run --rm -v "$PWD/apps:/work" ghcr.io/validator/validator:latest vnu --skip-non-html --errors-only /work
          else
            echo "No HTML files under apps/ yet; validation engages when app artifacts land."
          fi

      - name: Rubric lint (earl-lint, CC-3)
        run: |
          if find apps -type f -name '*.html' | grep -q .; then
            python3 packages/earl-lint/earl_lint.py apps
          else
            echo "No HTML files under apps/ yet; rubric lint engages when app artifacts land."
          fi

      - name: Build site
        run: python3 tools/build.py

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
