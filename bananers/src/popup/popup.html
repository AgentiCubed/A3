<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bananers</title>
  <link rel="stylesheet" href="../theme/tokens.css" />
  <style>
    body { width: 320px; padding: 14px; }
    .roster-row { display: flex; gap: 8px; margin: 10px 0; }
    .roster-pick {
      flex: 1; background: var(--bn-surface); border: 2px solid var(--bn-border);
      border-radius: 10px; padding: 6px 4px; cursor: pointer; text-align: center;
    }
    .roster-pick[aria-pressed='true'] { border-color: var(--bn-accent); background: var(--bn-surface-elevated); }
    .roster-pick svg { width: 34px; height: 52px; }
    .roster-pick .nm { display: block; font-size: 10px; color: var(--bn-text-secondary); margin-top: 2px; }
    #deploy { width: 100%; margin-top: 4px; }
    #status { min-height: 18px; margin-top: 8px; font-size: 12.5px; }
    footer { margin-top: 10px; font-size: 11.5px; }
    footer a { color: var(--bn-accent); }
  </style>
</head>
<body>
  <h2 id="greeting"></h2>
  <p class="bn-muted" id="stats"></p>
  <p class="bn-muted" id="choose-label"></p>
  <div class="roster-row" id="roster" role="group"></div>
  <button class="bn-btn" id="deploy"></button>
  <p id="status" class="bn-muted" role="status"></p>
  <footer><a href="#" id="open-dashboard">Open the Learn dashboard →</a></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
