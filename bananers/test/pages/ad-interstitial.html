<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Test: ad interstitial</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 40px; }
    #ad-takeover {
      position: fixed; inset: 0; z-index: 99999; background: #111;
      color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    #ad-skip { position: absolute; top: 16px; right: 20px; background: #333;
               color: #fff; border: 1px solid #555; padding: 8px 14px;
               border-radius: 6px; cursor: pointer; }
    .fake-ad { width: 480px; height: 240px; background: repeating-linear-gradient(45deg,#b91c1c,#b91c1c 20px,#991b1b 20px,#991b1b 40px);
               display: flex; align-items: center; justify-content: center; font-size: 26px; }
  </style>
</head>
<body>
  <h1>Article behind an ad</h1>
  <p>Advertisement supported content lives here.</p>

  <script>
    window.__adSkipped = false;
    setTimeout(() => {
      const ad = document.createElement('div');
      ad.id = 'ad-takeover';
      ad.innerHTML = `
        <div class="fake-ad">SPONSORED — BIG SALE</div>
        <p>Advertisement — your content will resume shortly.</p>
        <button id="ad-skip">Skip ad</button>`;
      document.body.appendChild(ad);
      document.body.style.overflow = 'hidden';
      document.getElementById('ad-skip').addEventListener('click', () => {
        window.__adSkipped = true;
        ad.remove();
        document.body.style.overflow = '';
      });
    }, 180);
  </script>
</body>
</html>
